<title>Tiny Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width lab notebook. A deep-teal shell band holds the header and the flask meter;
   work areas sit on a cool tinted ground; sheets rise from the bottom.
   Colour roles (OKLCH, AA-checked in both themes): canvas / surface / well, ink / ink-2,
   shell / on-shell, action, done / miss / warn, liquid (the flask's fill — the one signature colour). */
:root {
  --canvas: oklch(0.965 0.014 195);
  --surface: oklch(0.995 0.004 195);
  --well: oklch(0.925 0.02 195);
  --line: oklch(0.885 0.02 200);
  --ink: oklch(0.24 0.03 210);
  --ink-2: oklch(0.47 0.035 210);
  --shell: oklch(0.36 0.07 205);
  --shell-line: oklch(0.44 0.07 205);
  --on-shell: oklch(0.97 0.02 190);
  --on-shell-2: oklch(0.84 0.05 190);
  --action: oklch(0.50 0.10 205);
  --on-action: oklch(1 0 0);
  --action-soft: oklch(0.925 0.04 200);
  --done: oklch(0.52 0.13 150);
  --done-soft: oklch(0.93 0.05 150);
  --miss: oklch(0.54 0.17 28);
  --miss-soft: oklch(0.94 0.04 28);
  --on-state: oklch(1 0 0);
  --warn: oklch(0.50 0.11 65);
  --warn-soft: oklch(0.94 0.05 80);
  --liquid: oklch(0.82 0.15 158);
  --paper: oklch(0.955 0.035 92);
  --scrim: oklch(0.2 0.03 210 / 0.45);
  --shadow: 0 1px 2px oklch(0.3 0.03 210 / 0.08), 0 8px 24px oklch(0.3 0.03 210 / 0.06);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: oklch(0.17 0.02 210); --surface: oklch(0.215 0.022 210); --well: oklch(0.28 0.025 210); --line: oklch(0.31 0.025 210);
    --ink: oklch(0.94 0.012 195); --ink-2: oklch(0.74 0.03 200);
    --shell: oklch(0.26 0.05 205); --shell-line: oklch(0.33 0.05 205); --on-shell: oklch(0.96 0.02 190); --on-shell-2: oklch(0.80 0.05 190);
    --action: oklch(0.76 0.11 200); --on-action: oklch(0.18 0.03 210); --action-soft: oklch(0.31 0.05 205);
    --done: oklch(0.72 0.15 150); --done-soft: oklch(0.29 0.05 150); --miss: oklch(0.70 0.15 28); --miss-soft: oklch(0.29 0.05 28);
    --on-state: oklch(0.18 0.03 210); --warn: oklch(0.80 0.12 75); --warn-soft: oklch(0.30 0.05 75);
    --liquid: oklch(0.80 0.15 158); --paper: oklch(0.86 0.04 90); --scrim: oklch(0.05 0.01 210 / 0.6);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 24px oklch(0 0 0 / 0.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: oklch(0.17 0.02 210); --surface: oklch(0.215 0.022 210); --well: oklch(0.28 0.025 210); --line: oklch(0.31 0.025 210);
  --ink: oklch(0.94 0.012 195); --ink-2: oklch(0.74 0.03 200);
  --shell: oklch(0.26 0.05 205); --shell-line: oklch(0.33 0.05 205); --on-shell: oklch(0.96 0.02 190); --on-shell-2: oklch(0.80 0.05 190);
  --action: oklch(0.76 0.11 200); --on-action: oklch(0.18 0.03 210); --action-soft: oklch(0.31 0.05 205);
  --done: oklch(0.72 0.15 150); --done-soft: oklch(0.29 0.05 150); --miss: oklch(0.70 0.15 28); --miss-soft: oklch(0.29 0.05 28);
  --on-state: oklch(0.18 0.03 210); --warn: oklch(0.80 0.12 75); --warn-soft: oklch(0.30 0.05 75);
  --liquid: oklch(0.80 0.15 158); --paper: oklch(0.86 0.04 90); --scrim: oklch(0.05 0.01 210 / 0.6);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 24px oklch(0 0 0 / 0.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--canvas); color: var(--ink); font: 15px/1.45 var(--font-body); margin: 0; caret-color: var(--action); accent-color: var(--action); scrollbar-color: var(--line) transparent; }
::selection { background: var(--action-soft); color: var(--ink); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 6px; }

.app { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; background: var(--canvas); }
@media (min-width: 520px) { .app { border-inline: 1px solid var(--line); } }

/* Shell band */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--shell); color: var(--on-shell); padding: 14px 16px 12px; display: flex; align-items: center; gap: 12px; view-transition-name: shell; }
.top h1 { font: 700 1.6rem/1.1 var(--font-display); margin: 0; flex: 1; letter-spacing: -.01em; text-wrap: balance; }
.top .date { display: block; font: 500 .72rem var(--font-mono); color: var(--on-shell-2); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 3px; }
.icon-btn { border: 0; background: oklch(1 0 0 / 0.12); color: var(--on-shell); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: background .15s, transform .12s var(--ease-out); }
.icon-btn:hover { background: oklch(1 0 0 / 0.2); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.danger { color: var(--on-shell); }
.back { border: 0; background: none; color: var(--on-shell); padding: 6px 0; font-weight: 600; display: flex; align-items: center; gap: 2px; }

/* Flask meter: today's logged share, the app's signature move */
.meter { display: flex; align-items: center; gap: 8px; color: var(--on-shell-2); font: 500 .78rem var(--font-mono); font-variant-numeric: tabular-nums; }
.meter b { color: var(--on-shell); font: 700 1.05rem var(--font-display); }
.flask { width: 30px; height: 36px; flex: none; overflow: visible; }
.flask .glass { fill: none; stroke: var(--on-shell); stroke-width: 2.4; stroke-linejoin: round; }
.flask .fill { fill: var(--liquid); transform: translateY(var(--lvl-y, 45px)); transition: transform .9s var(--ease-out); }
.flask .surface { fill: none; stroke: oklch(1 0 0 / 0.55); stroke-width: 1.4; transform: translateY(var(--lvl-y, 45px)); transition: transform .9s var(--ease-out); }
.flask.full .glass { stroke: var(--liquid); }

main { flex: 1; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
.demo-note { font-size: .78rem; color: var(--ink-2); background: var(--well); border-radius: 10px; padding: 8px 12px; margin: 0; }

section h2 { font: 500 .72rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px 4px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.group > * + * { border-top: 1px solid var(--line); }
.foot { font-size: .78rem; color: var(--ink-2); margin: 6px 4px 0; }
.pad { padding: 12px 14px; }

.progress { padding: 12px 14px; display: grid; gap: 8px; }
.progress b { font-weight: 600; }
.bar { height: 8px; background: var(--well); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--action), var(--done)); border-radius: 99px; transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform .7s var(--ease-out); }

/* Today rows */
.row { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; transition: background .2s; }
.row.logged-done { background: color-mix(in oklch, var(--done-soft) 55%, var(--surface)); }
.row.logged-miss { background: color-mix(in oklch, var(--miss-soft) 45%, var(--surface)); }
.row-main { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 2px 0; display: grid; gap: 2px; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-sub { font: 500 .75rem var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.log { position: relative; isolation: isolate; overflow: hidden; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid transparent; display: grid; place-items: center; flex: none; transition: transform .12s var(--ease-out), color .2s; }
.log svg { position: relative; z-index: 1; }
.log::before { content: ""; position: absolute; inset: 0; z-index: 0; clip-path: inset(100% 0 0 0); transition: clip-path .18s var(--ease-in); }
.log:active { transform: scale(.9); }
.log.miss { background: var(--miss-soft); color: var(--miss); }
.log.done { background: var(--done-soft); color: var(--done); }
.log.miss::before { background: var(--miss); }
.log.done::before { background: var(--done); }
.log.on { color: var(--on-state); }
.log.on::before { clip-path: inset(0 0 0 0); }
.log.just::before { animation: rise .42s var(--ease-out) both; }
.log .ic { width: 20px; height: 20px; stroke-width: 2.4; }
.ic.draw path { stroke-dasharray: 1; stroke-dashoffset: 0; }
.log.just .ic.draw path { animation: draw .32s .12s var(--ease-out) both; }
.log.just .ic.draw path + path { animation-delay: .2s; }
@keyframes rise { from { clip-path: inset(100% 0 0 0 round 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes grow-in { from { transform: scale(0); } }

.link-row { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 12px 14px; transition: background .15s; }
.link-row:hover, .action:hover, .reason:hover { background: color-mix(in oklch, var(--action-soft) 45%, transparent); }
.link-row .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
.chev { color: var(--ink-2); flex: none; }

/* Status pills: colour + word, never colour alone */
.pill { display: inline-flex; align-items: center; gap: 4px; font: 600 .7rem var(--font-body); padding: 2px 8px; border-radius: 99px; background: var(--action-soft); color: var(--action); white-space: nowrap; }
.pill.s-operationalized { background: var(--done-soft); color: var(--done); }
.pill.s-completed { background: var(--well); color: var(--ink-2); }
.pill.s-paused, .pill.warn { background: var(--warn-soft); color: var(--warn); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 4px; padding: 12px 8px; }
.stat { text-align: center; display: grid; gap: 1px; }
.stat b { font: 700 1.25rem var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .7rem; color: var(--ink-2); }

.hero { padding: 14px; display: grid; gap: 8px; }
.hero > * + * { border-top: 0; }
.hero h3 { font: 700 1.3rem/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.hero .q { color: var(--ink-2); font-style: italic; display: flex; gap: 8px; align-items: flex-start; }
.hero .q .ic { margin-top: 2px; color: var(--action); }
.meta { display: flex; align-items: center; gap: 6px; }
.meta { font: 500 .75rem var(--font-mono); color: var(--ink-2); }

/* Day grid */
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 12px; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 8px; border: 0; background: var(--well); color: var(--ink-2); font: 500 .75rem var(--font-mono); position: relative; display: grid; place-items: center; transition: background .2s, color .2s, transform .12s var(--ease-out); }
.cell:not(:disabled):hover { box-shadow: inset 0 0 0 1.5px var(--action); }
.cell:not(:disabled):active { transform: scale(.9); }
.cell.d { background: var(--done); color: var(--on-state); }
.cell.m { background: var(--miss); color: var(--on-state); }
.cell.today { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--action); }
.cell.future { opacity: .4; cursor: default; background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.cell.just { animation: settle .26s var(--ease-out); }
@keyframes settle { from { transform: scale(.82); } }
.cell .dot { position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.seg { display: flex; background: var(--well); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 6px 4px; border-radius: 8px; font-size: .82rem; font-weight: 500; color: var(--ink-2); transition: background .18s, color .18s; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.field { display: grid; gap: 4px; padding: 10px 14px; transition: background .15s; }
.field label, .lbl { font-size: .75rem; color: var(--ink-2); font-weight: 500; }
.field input, .field textarea, .field select { border: 0; background: transparent; padding: 2px 0; width: 100%; resize: vertical; outline: none; }
.field input::placeholder, .field textarea::placeholder { color: var(--ink-2); opacity: .75; }
.field textarea { min-height: 2.6em; }
.field:focus-within { background: color-mix(in oklch, var(--action-soft) 50%, transparent); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: .88rem; display: inline-flex; align-items: center; gap: 6px; transition: transform .12s var(--ease-out), filter .15s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--action); color: var(--on-action); border-color: var(--action); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--miss); }
.btn.danger-fill { background: var(--miss); border-color: var(--miss); color: var(--on-state); }
.btn.block { width: 100%; justify-content: center; }
.action { width: 100%; border: 0; background: none; text-align: left; padding: 12px 14px; color: var(--action); font-weight: 600; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: center; transition: background .15s; }
.action.danger { color: var(--miss); }
.action small { flex-basis: 100%; color: var(--ink-2); font-weight: 400; font-size: .8rem; }

.levels { display: flex; gap: 4px; }
.levels i { flex: 1; height: 6px; border-radius: 99px; background: var(--well); transition: background .3s; }
.levels i.on { background: var(--action); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: .82rem; white-space: nowrap; transition: background .18s, color .18s; }
.chip.on { background: var(--shell); color: var(--on-shell); border-color: var(--shell); }
.empty { padding: 28px 18px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--ink-2); }
.empty h3 { font: 700 1.15rem var(--font-display); color: var(--ink); margin: 0; }

.tabs { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); view-transition-name: tabs; }
.tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: .68rem; font-weight: 500; color: var(--ink-2); padding: 4px 0; position: relative; transition: color .18s; }
.tabs button.on { color: var(--action); }
.tabs button.on::after { content: ""; position: absolute; top: -6px; width: 22px; height: 3px; border-radius: 0 0 3px 3px; background: var(--action); }

/* Sheets: enter on a long deceleration, exit faster */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .22s ease-out; }
.sheet { background: var(--canvas); width: 100%; max-width: 460px; max-height: 88%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 8px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; animation: sheet-in .42s var(--ease-out); box-shadow: 0 -10px 40px oklch(0 0 0 / 0.18); }
.scrim.closing { animation: fade .18s ease-in reverse forwards; }
.scrim.closing .sheet { animation: sheet-out .18s var(--ease-in) forwards; }
@keyframes fade { from { opacity: 0; } }
@keyframes sheet-in { from { transform: translateY(100%); } }
@keyframes sheet-out { to { transform: translateY(100%); } }
.sheet .grab { width: 36px; height: 5px; border-radius: 99px; background: var(--line); margin: 2px auto 0; }
.sheet-head { display: flex; align-items: center; gap: 8px; }
.sheet-head h3 { flex: 1; margin: 0; font: 700 1.15rem var(--font-display); text-align: center; }
.sheet-head button { border: 0; background: none; color: var(--action); font-weight: 600; min-width: 60px; }
.sheet-head button:first-child { text-align: left; font-weight: 400; }
.sheet-head button:last-child { text-align: right; }
.sheet-head button:disabled { color: var(--ink-2); opacity: .6; cursor: default; }
.reason { display: flex; gap: 12px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 12px 14px; transition: background .15s; }
.reason .tag { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--miss-soft); color: var(--miss); font: 700 .8rem var(--font-mono); }
.reason b { display: block; }
.reason span { color: var(--ink-2); font-size: .82rem; }
.check { display: flex; gap: 8px; align-items: center; padding: 8px 14px; font-size: .88rem; }
.check .ic { color: var(--ink-2); }
.check .ic.ok { color: var(--done); }
.check .ic.tick path { stroke-dasharray: 1; animation: draw .32s .05s var(--ease-out) both; }
.check .ic.tick circle { transform-box: fill-box; transform-origin: center; animation: settle .26s var(--ease-out); }
.check em { margin-left: auto; font-style: normal; font-size: .75rem; color: var(--ink-2); }
.stepper { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.stepper b { flex: 1; font-weight: 500; }
.stepper button { display: grid; place-items: center; width: 34px; height: 30px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; transition: transform .12s var(--ease-out); }
.stepper button:active { transform: scale(.92); }
.inline { display: flex; align-items: baseline; gap: 6px; }
.inline span { color: var(--ink-2); white-space: nowrap; }
pre.json { margin: 0; max-height: 240px; overflow: auto; font: .72rem/1.4 var(--font-mono); padding: 12px; background: var(--well); border-radius: 10px; white-space: pre; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--shell); color: var(--on-shell); padding: 8px 16px; border-radius: 99px; font-size: .85rem; z-index: 30; box-shadow: var(--shadow); animation: toast-in .32s var(--ease-out); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } }
.guide { padding: 12px 14px; display: grid; gap: 4px; }
.guide b { font: 700 1rem var(--font-display); }
.guide p { margin: 0; color: var(--ink-2); font-size: .88rem; max-width: 60ch; }

/* Icons: Tiny Lab set (design/build_icons.py). 24 grid, 1.75 stroke, round caps. */
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 16px; height: 16px; }
.ic.xs { width: 13px; height: 13px; vertical-align: -2px; stroke-width: 2; }
.ic.lg { width: 24px; height: 24px; }
.ic.xl { width: 48px; height: 48px; stroke-width: 1.5; color: var(--action); }
.ic.kind { color: var(--action); }
.streak .last { fill: currentColor; }
.ic.xs.streak { width: 17px; height: 17px; vertical-align: -4px; stroke-width: 1.9; }
.streak.grew .last { transform-box: fill-box; transform-origin: center; animation: grow-in .36s .3s var(--ease-out) both; }
.action .ic, .reason .ic { color: inherit; }
.action.danger .ic { color: var(--miss); }
.reason .tag .ic { width: 20px; height: 20px; }
.guide b { display: flex; align-items: center; gap: 8px; }
.guide b .ic { color: var(--action); }
.growth { display: block; width: 100%; height: auto; max-width: 100%; }
.growth .track { stroke: var(--line); stroke-width: 2; fill: none; }
.growth .arrow { stroke: var(--ink-2); stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.growth .node { fill: var(--surface); stroke: var(--action); stroke-width: 1.75; }
.growth .node.end { fill: var(--action); }
.growth .glyph { color: var(--action); }
.growth .glyph.end { color: var(--on-action); }
.growth text { fill: var(--ink); font: 600 12px var(--font-body); }
.growth text.n { fill: var(--ink-2); font: 500 11px var(--font-mono); }

/* Sketch and ink (design/art.js). Experiments are pencil sketches on paper;
   proven practices and capabilities are clean ink on the app's own surface. */
.thumb { width: 40px; height: 40px; border-radius: 10px; flex: none; overflow: hidden; display: block; background: var(--paper); }
.thumb.ink, .thumb.crest { background: var(--action-soft); }
.thumb svg, .art-frame svg { display: block; width: 100%; height: 100%; }
.row .thumb { margin-right: 2px; }
.hero-top { display: flex; gap: 14px; align-items: flex-start; }
.hero-text { flex: 1; min-width: 0; display: grid; gap: 8px; align-content: start; }
.art-panel { margin: 0; flex: none; display: grid; gap: 6px; justify-items: center; }
.art-frame { position: relative; width: 108px; height: 108px; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--paper); box-shadow: inset 0 0 0 1px oklch(0.3 0.03 90 / 0.12); }
.art-panel.ink .art-frame, .art-panel.crest .art-frame { background: var(--action-soft); box-shadow: none; }
.art-frame .layer { position: absolute; inset: 0; }
.art-panel figcaption { font: 500 .64rem var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); text-align: center; }
.ink-line { fill: none; stroke: var(--action); stroke-linecap: round; stroke-linejoin: round; }
.ink-liquid { fill: var(--done); }
.ink-meniscus { fill: none; stroke: var(--on-state); stroke-opacity: .55; stroke-linecap: round; }
.ink-tick { fill: none; stroke: var(--on-state); stroke-linecap: round; stroke-linejoin: round; }
.crest-track { fill: none; stroke: var(--line); stroke-linecap: round; }
.crest-on { fill: none; stroke: var(--action); stroke-linecap: round; }
/* Signature: a proven pact is re-inked. Sketch blurs off the paper, ink draws on, liquid pours in, tick last. */
.art-panel.inking .art-frame { animation: paper-to-ink .7s .15s ease-out both; }
.art-panel.inking .out { animation: sketch-out .5s .1s var(--ease-in) forwards; }
.art-panel.inking .in .draw { stroke-dasharray: 1; animation: draw .9s .45s var(--ease-out) both; }
.art-panel.inking .in .ink-liquid { transform-box: fill-box; transform-origin: 50% 100%; animation: grow-up .7s .95s var(--ease-out) both; }
.art-panel.inking .in .ink-tick { animation-delay: 1.35s; }
.art-panel.drawing .crest-on { stroke-dasharray: 1; animation: draw .6s var(--ease-out) both; }
@keyframes paper-to-ink { from { background: var(--paper); } }
@keyframes sketch-out { to { opacity: 0; filter: blur(4px); transform: scale(.96); } }
@keyframes grow-up { from { transform: scaleY(0); } }

/* Question-to-capability bridge (design/art.js bridge()) */
.bridge-head { padding: 14px 14px 0; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font: 600 .95rem var(--font-body); }
.bridge-head b { font: 700 2rem/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--action); }
.bridge-head span { flex-basis: 100%; font-weight: 400; color: var(--ink-2); font-size: .85rem; }
.group > .bridge-head + .bridge-q, .group > .bridge-head + .bridge-wrap, .group > .bridge-q + .bridge-wrap { border-top: 0; }
.bridge-q { margin: 0; padding: 8px 14px 0; display: flex; gap: 8px; align-items: flex-start; font-style: italic; color: var(--ink-2); }
.bridge-q .ic { margin-top: 2px; color: var(--action); }
.bridge-wrap { padding: 4px 6px 2px; overflow: hidden; }
.bridge-wrap > svg { display: block; width: 100%; height: auto; }
.br-bank { fill: var(--well); }
.br-water { fill: none; stroke: var(--action-soft); stroke-width: 2; stroke-linecap: round; }
.br-hatch path { fill: none; stroke: var(--action); stroke-width: 2.6; stroke-linecap: round; opacity: .5; }
.br-sketch { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; }
.br-sketch.thick { stroke-width: 2.6; }
.br-ink-deck { fill: var(--action); }
.br-ink-line { fill: none; stroke: var(--action); stroke-width: 2.6; stroke-linecap: round; }
.br-todo { fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-dasharray: 3 4; }
.br-pin { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; }
.br-pin.ink { fill: var(--action); stroke: var(--action); }
.br-num { font: 600 9px var(--font-mono); fill: var(--ink); }
.br-pin.ink + .br-num { fill: var(--on-action); }
.br-today { stroke: var(--miss); stroke-width: 1.8; stroke-linecap: round; }
.br-axis { font: 500 9px var(--font-mono); fill: var(--ink-2); }
.br-sign { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; }
.br-sign-q { font: 700 13px var(--font-display); fill: var(--ink); }
/* The built part of the bridge extends from the question bank to today. */
.bridge-wrap .br-built { animation: build 1.1s .15s var(--ease-out) both; }
@keyframes build { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.milestones { list-style: none; margin: 0; padding: 4px 0; }
.milestones li { display: flex; align-items: center; gap: 10px; padding: 7px 14px; }
.milestones .grow { flex: 1; min-width: 0; }
.milestones .mnum { width: 20px; height: 20px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 600 .66rem var(--font-mono); background: var(--action); color: var(--on-action); }
.milestones li.todo { color: var(--ink-2); }
.milestones li.todo .mnum { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }

/* Screen-to-screen continuity (View Transitions; static fallback where unsupported) */
::view-transition-old(root) { animation: vt-fade-out .16s ease-in both; }
::view-transition-new(root) { animation: vt-fade-in .24s var(--ease-out) both; }
html[data-nav="forward"]::view-transition-old(root) { animation: vt-out-left .18s var(--ease-in) both; }
html[data-nav="forward"]::view-transition-new(root) { animation: vt-in-right .32s var(--ease-out) both; }
html[data-nav="back"]::view-transition-old(root) { animation: vt-out-right .18s var(--ease-in) both; }
html[data-nav="back"]::view-transition-new(root) { animation: vt-in-left .32s var(--ease-out) both; }
@keyframes vt-fade-out { to { opacity: 0; } }
@keyframes vt-fade-in { from { opacity: 0; } }
@keyframes vt-out-left { to { opacity: 0; transform: translateX(-28px); } }
@keyframes vt-in-right { from { opacity: 0; transform: translateX(36px); } }
@keyframes vt-out-right { to { opacity: 0; transform: translateX(28px); } }
@keyframes vt-in-left { from { opacity: 0; transform: translateX(-36px); } }

/* Reduced motion: no spatial movement; colour, opacity and state feedback stay */
@media (prefers-reduced-motion: reduce) {
  .sheet, .scrim.closing .sheet { animation: fade .2s ease-out; }
  .scrim.closing .sheet { animation: fade .15s ease-in reverse forwards; }
  .cell.just, .toast { animation: fade .2s ease-out; }
  .streak.grew .last, .check .ic.tick circle { animation: none; }
  .art-panel.inking .out { animation: vt-fade-out .3s forwards; }
  .art-panel.inking .in { animation: fade .4s .2s both; }
  .art-panel.inking .in .draw, .art-panel.inking .in .ink-liquid, .art-panel.drawing .crest-on { animation: none; }
  .bridge-wrap .br-built { animation: fade .4s ease-out both; }
  .log:active, .cell:active, .btn:active, .icon-btn:active { transform: none; }
  .flask .fill, .flask .surface, .bar > i { transition-duration: .2s; }
  html[data-nav]::view-transition-old(root), html[data-nav]::view-transition-new(root) { animation-name: vt-fade-out; }
  html[data-nav]::view-transition-new(root) { animation-name: vt-fade-in; }
}
